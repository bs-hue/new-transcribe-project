# Runs every check on every push and pull request.
#
# CI is the authority, not the local hooks: hooks can be skipped, this cannot.
# Backend and frontend run as separate jobs so they execute in parallel and a
# failure points straight at the side that broke.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run — no point spending
# minutes verifying a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile and the supported range in pyproject.toml.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        # `--diff` rather than `--check`: it prints exactly what would change, so a
        # formatting failure is immediately actionable instead of just naming files.
        run: ruff format --diff .

      - name: Type-check (strict)
        run: mypy app

      - name: Tests
        run: pytest

      - name: Migrations apply to a clean database
        # Proves the migration chain actually runs, which autogenerated
        # revisions do not guarantee on their own.
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./data/ci.db

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci` installs exactly the lockfile — reproducible builds.
        run: npm ci --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
