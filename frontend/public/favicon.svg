  <rect width="32" height="32" rx="7" fill="#2563eb" />
  <text
    x="16"
    y="22"
    text-anchor="middle"
    font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    font-size="19"
    font-weight="700"
    fill="#ffffff"
  >R</text>
</svg>
