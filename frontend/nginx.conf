server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: /library/abc123 is a React route, not a file on disk,
    # so unknown paths must fall back to index.html instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves browsers on old assets.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The API, on the same origin as the site.
    #
    # Without this the browser has to be told a separate address for the API,
    # and that address is compiled into the JavaScript at build time. That works
    # on a laptop, where it is always localhost, and breaks the moment the app
    # is deployed: the visitor's browser tries to reach the API on *their own*
    # machine. Proxying here means one domain, one certificate, and no CORS —
    # the browser only ever talks to the address it is already on.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Transcribing a long video keeps the request open; the default 60s
        # would cut a bulk export off part-way through.
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;

        client_max_body_size 32m;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
