# Production stack backed by Supabase (or any hosted PostgreSQL).
#
# Identical to docker-compose.prod.yml except there is no database container:
# the database lives at Supabase, so this server runs only the application.
# The trade-off is deliberate — Supabase handles backups, upgrades and
# availability; you no longer control where the data physically sits, and every
# query crosses the internet instead of a Docker network.
#
# Usage:
#   cp .env.production.example .env.production   # then set DATABASE_URL
#   docker compose -f docker-compose.supabase.yml --env-file .env.production up -d
#
# See docs/SUPABASE.md for where the connection string comes from.

name: research-hub

services:
  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set — see docs/SUPABASE.md}
      WORK_DIR: /data/work
      HF_HOME: /data/models
      YOUTUBE_COOKIES_TEXT: ${YOUTUBE_COOKIES_TEXT:-}
      CORS_ORIGINS: https://${DOMAIN:-localhost}
    command: >
      sh -c "python -m app.cli migrate &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile_inline: |
        FROM caddy:2-alpine
        COPY Caddyfile /etc/caddy/Caddyfile
    expose:
      - "80"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  api-data:
  caddy-data:
  caddy-config:
